<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ركن البُنّ | قهوة مختصة في عمّان</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#E8EEEC;--ink:#17332C;--saffron:#E8A317;--muted:#5C7169;--line:#C2D1CB}
*{box-sizing:border-box;margin:0}
body{font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7}
h1,h2,h3,.price{font-family:'Readex Pro',Tahoma,sans-serif}
header{background:var(--ink);color:#fff;padding:64px 5vw 80px}
header h1{font-size:clamp(2.2rem,6vw,4rem);line-height:1.25;max-width:13ch}
header p{max-width:46ch;margin-top:16px;color:#C5D6D0}
header .hours{display:inline-block;margin-top:24px;border:1px solid #3E6156;border-radius:999px;padding:4px 16px;font-size:.9rem}
main{display:grid;grid-template-columns:1fr 340px;gap:32px;padding:0 5vw 64px;margin-top:-36px;align-items:start}
.menu{background:#fff;border-radius:16px;padding:24px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{font:inherit;border:1px solid var(--line);background:none;border-radius:999px;padding:4px 16px;cursor:pointer;color:var(--ink)}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.item{display:flex;justify-content:space-between;gap:16px;padding:16px 0;border-top:1px dashed var(--line)}
.item h3{font-size:1.05rem}.item p{color:var(--muted);font-size:.9rem}
.item .price{font-weight:600;white-space:nowrap}
.add{font:inherit;margin-top:8px;border:0;background:var(--saffron);color:#2A1D00;border-radius:8px;padding:4px 16px;cursor:pointer;font-weight:500}
.ticket{position:sticky;top:16px;background:#fff;padding:24px;border-radius:4px 4px 0 0;
 -webkit-mask:radial-gradient(circle 8px at 50% 100%,#0000 98%,#000) 0 100%/20px 100% repeat-x;mask:radial-gradient(circle 8px at 50% 100%,#0000 98%,#000) 0 100%/20px 100% repeat-x;padding-bottom:36px}
.ticket h2{font-size:1.2rem;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:8px}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:.95rem}
.qty button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:none;cursor:pointer;font-size:1rem}
.qty span{display:inline-block;min-width:24px;text-align:center}
.empty{color:var(--muted);padding:16px 0}
.total{display:flex;justify-content:space-between;border-top:2px solid var(--ink);margin-top:8px;padding-top:12px;font-weight:700;font-family:'Readex Pro',Tahoma}
.send{width:100%;margin-top:16px;font:inherit;font-weight:600;border:0;border-radius:8px;background:var(--ink);color:#fff;padding:12px;cursor:pointer}
.send:disabled{opacity:.4;cursor:not-allowed}
#msg{margin-top:12px;color:var(--ink);font-weight:500}
button:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
@media(max-width:820px){main{grid-template-columns:1fr}.ticket{position:static}}
</style>
</head>
<body>
<header>
  <h1>قهوة مختصة، محمّصة في عمّان.</h1>
  <p>نحمّص حبوبنا كل أسبوع ونقدّمها طازجة. اختر مشروبك من القائمة وشاهد طلبك يتكوّن أمامك.</p>
  <span class="hours">نفتح يومياً من 8 صباحاً حتى 11 مساءً</span>
</header>
<main>
  <section class="menu" aria-label="القائمة">
    <div class="tabs" id="tabs"></div>
    <div id="list"></div>
  </section>
  <aside class="ticket" aria-live="polite">
    <h2>طلبك</h2>
    <div id="rows"></div>
    <div class="total"><span>المجموع</span><span id="total">0.00 د.أ</span></div>
    <button class="send" id="send" disabled>أرسل الطلب</button>
    <p id="msg"></p>
  </aside>
</main>
<script>
const items=[
 {id:1,cat:'قهوة',name:'قهوة عربية بالهيل',desc:'محمّصة خفيفة مع هيل مطحون',price:1.5},
 {id:2,cat:'قهوة',name:'فلات وايت',desc:'إسبريسو مزدوج وحليب مخملي',price:2.75},
 {id:3,cat:'قهوة',name:'V60 مقطّرة',desc:'تحضير يدوي، نكهات فاكهية',price:3.25},
 {id:4,cat:'باردة',name:'كولد برو',desc:'منقوعة 18 ساعة',price:3},
 {id:5,cat:'باردة',name:'ليمون ونعنع',desc:'منعش، مع ثلج مجروش',price:2.25},
 {id:6,cat:'حلويات',name:'كنافة صغيرة',desc:'تقدَّم دافئة بقطر خفيف',price:2.5},
 {id:7,cat:'حلويات',name:'كيكة التمر',desc:'مع صلصة كراميل',price:2.75}
];
const cats=['الكل','قهوة','باردة','حلويات'];
let cat='الكل',cart={};
const $=s=>document.querySelector(s),fmt=n=>n.toFixed(2)+' د.أ';
function renderMenu(){
  $('#tabs').innerHTML=cats.map(c=>`<button class="${c===cat?'on':''}" data-c="${c}">${c}</button>`).join('');
  $('#list').innerHTML=items.filter(i=>cat==='الكل'||i.cat===cat).map(i=>
   `<div class="item"><div><h3>${i.name}</h3><p>${i.desc}</p><button class="add" data-id="${i.id}">أضف للطلب</button></div><span class="price">${fmt(i.price)}</span></div>`).join('');
}
function renderCart(){
  const ids=Object.keys(cart);let sum=0;
  $('#rows').innerHTML=ids.length?ids.map(id=>{const i=items.find(x=>x.id==id),q=cart[id];sum+=i.price*q;
   return `<div class="row"><span>${i.name}</span><span class="qty"><button data-d="-1" data-id="${id}" aria-label="إنقاص">−</button><span>${q}</span><button data-d="1" data-id="${id}" aria-label="زيادة">+</button></span></div>`}).join(''):'<p class="empty">الطلب فارغ. اختر من القائمة لتبدأ.</p>';
  $('#total').textContent=fmt(sum);$('#send').disabled=!ids.length;
}
function change(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];renderCart()}
document.addEventListener('click',e=>{
  const t=e.target;
  if(t.dataset.c){cat=t.dataset.c;renderMenu()}
  else if(t.classList.contains('add')){change(t.dataset.id,1);$('#msg').textContent=''}
  else if(t.dataset.d){change(t.dataset.id,+t.dataset.d)}
});
$('#send').onclick=()=>{
  const n=Math.floor(100+Math.random()*900);
  cart={};renderCart();$('#msg').textContent='تم استلام طلبك رقم #'+n+'. نناديك عند الجاهزية.';
};
renderMenu();renderCart();
</script>
</body>
</html>
